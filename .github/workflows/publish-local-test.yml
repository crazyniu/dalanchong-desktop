name: Build Mac test release to Gitee
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Mac arm64 test version (vX.Y.Z)
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: dalanchong-release
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          version: 11.15.1
          install: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - run: node scripts/prepare-release.mjs --tag "$RELEASE_TAG"
      - name: Build Mac arm64 test package
        run: node scripts/package.mjs darwin arm64
        env:
          APPLE_SIGNING_IDENTITY: '-'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-darwin-arm64
          path: dist-release/tauri/**
          if-no-files-found: error
      - name: Publish to Gitee
        run: node scripts/publish-release.mjs --tag "$RELEASE_TAG" --artifacts dist-release/tauri --targets darwin/arm64
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
