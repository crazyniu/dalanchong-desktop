# AI file map
# Purpose: existing manual check of configured Gitee publication access.
# Entry: workflow_dispatch runs publish-release.mjs --verify-access with the secret token.
# Flow: install dependencies and inspect access through the release helper.
# Boundary: this contacts an external service; ordinary code/comment work must not invoke
# it, print secrets, or treat it as proof that artifacts were published or installed.

name: Validate Gitee access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          version: 11.15.1
          install: false
      - run: pnpm install --frozen-lockfile
      - run: node scripts/publish-release.mjs --verify-access
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
