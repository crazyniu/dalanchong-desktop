name: Release to Gitee
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (vX.Y.Z)
        required: true
        type: string
      publish:
        description: Sign, notarize and publish the release
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: dalanchong-release
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: windows-latest
            platform: win32
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_BUILD: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          version: 11.15.1
          install: false
      - run: pnpm install --frozen-lockfile
      - run: node scripts/prepare-release.mjs --tag "$RELEASE_TAG"
        shell: bash
      - name: Prepare Apple notarization key
        if: matrix.platform == 'darwin' && env.RELEASE_BUILD == 'true'
        shell: bash
        env:
          APPLE_API_KEY_CONTENTS: ${{ secrets.APPLE_API_KEY_CONTENTS }}
        run: |
          test -n "$APPLE_API_KEY_CONTENTS" || { echo 'Missing APPLE_API_KEY_CONTENTS'; exit 1; }
          umask 077
          printf '%s' "$APPLE_API_KEY_CONTENTS" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - run: pnpm build
      - run: node scripts/package.mjs ${{ matrix.platform }} ${{ matrix.arch }}
        env:
          CSC_LINK: ${{ matrix.platform == 'darwin' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'darwin' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist-release/**/*.dmg
            dist-release/**/*.zip
            dist-release/**/*.exe
            dist-release/**/*.blockmap
            dist-release/**/latest*.yml
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          version: 11.15.1
          install: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist-release
          merge-multiple: true
      - run: node scripts/publish-release.mjs --tag "$RELEASE_TAG" --artifacts dist-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
