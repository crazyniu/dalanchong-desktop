# AI file map
# Purpose: retain the existing pull-request/main-branch validation workflow.
# Entry: pull_request, main push, or explicit workflow_dispatch triggers configured jobs.
# Flow: install locked dependencies and run the declared frontend/core/script/native checks.
# Boundary: CI is not a packaging or publication workflow. Comment maintenance must not
# change triggers, commands, permissions, or launch this workflow for extra testing.

name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          version: 11.15.1
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:core && pnpm test:scripts
      - run: pnpm build

  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
