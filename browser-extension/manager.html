<!doctype html>
<!--
AI file map
Purpose: Douyin batch parsing and download workspace.
Entry: opened by the extension popup or the shop browser bookmark.
Flow: manager.js owns link parsing, selected formats, copying, downloads and preview;
theme.css, manager.css and player.css match the desktop application's neutral controls.
Boundary: IDs are the controller contract. The background owns validated media and the queue.
-->
<html lang="zh-CN" class="wa-light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>抖音视频下载 · 大懒虫</title>
  <link rel="icon" type="image/png" href="assets/icon-32.png">
  <link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="player.css"><link rel="stylesheet" href="manager.css">
</head>
<body>
  <header class="topbar"><div class="topbar-inner">
    <a class="brand" href="#videos"><img src="assets/logo.png" alt=""><strong>大懒虫</strong></a>
  </div></header>
  <main class="page">
    <section id="videos-view" aria-labelledby="videos-title">
      <div class="view-head"><h1 id="videos-title">抖音视频下载</h1></div>
      <form id="parse-form" class="parse card">
        <div class="parse-inputs">
          <label for="video-url" class="sr-only">抖音链接或分享文案，每行一个</label>
          <textarea id="video-url" class="parse-text" rows="2" placeholder="粘贴抖音链接或分享文案，每行一个" autocomplete="off" spellcheck="false"></textarea>
          <div class="parse-controls">
            <wa-select id="parse-quality" value="hd" size="s" class="parse-quality label-hidden" label="解析画质">
              <wa-option value="hd">高清</wa-option><wa-option value="original">原片</wa-option>
            </wa-select>
            <button id="parse" class="btn primary" type="submit">解析</button>
          </div>
        </div>
        <div id="link-count" class="link-count muted"></div>
        <details id="parse-results" class="parse-results" hidden>
          <summary class="results-toggle"><span>解析记录</span><span id="results-summary" aria-live="polite"></span><wa-icon name="chevron-down"></wa-icon></summary>
          <div class="results-head"><button id="results-clear" class="btn sm" type="button">清除记录</button></div>
          <ul id="results-list" class="results-list" role="status" aria-live="polite"></ul>
        </details>
      </form>
      <section class="library card" aria-label="视频列表">
        <div class="toolbar">
          <h2>视频列表 <span id="visible-count" class="counter">0</span></h2>
          <wa-input id="search" value="" class="toolbar-search label-hidden" label="搜索视频" placeholder="搜索标题或来源" with-clear><wa-icon name="search" slot="start"></wa-icon></wa-input>
          <button id="clear" class="btn outline danger" type="button" disabled><wa-icon name="trash-2"></wa-icon>清空</button>
        </div>
        <div class="table-head" id="table-head" hidden>
          <wa-checkbox id="select-all"><span class="sr-only">选择当前显示的全部视频</span></wa-checkbox>
          <span>视频与来源</span><span class="col-quality">画质</span><span class="col-size">大小</span><span class="col-actions">操作</span>
        </div>
        <div id="media-list" class="media-list"></div>
        <div id="library-status" class="library-status" role="status"><wa-spinner></wa-spinner><span>正在加载视频…</span></div>
        <div id="empty" class="empty" hidden><wa-icon name="video"></wa-icon><h3>暂无视频</h3></div>
      </section>
      <div id="batch-bar" class="batch-bar" hidden>
        <div class="batch-meta"><span id="batch-summary">0 个视频</span><span id="job-summary" class="muted"></span></div>
        <div class="batch-actions">
          <button id="batch-clear" class="btn sm" type="button" hidden>取消选择</button>
          <button id="batch-copy" class="btn outline" type="button" disabled><wa-icon name="copy"></wa-icon>复制所选地址</button>
          <button id="download-all" class="btn primary" type="button" disabled><wa-icon name="download"></wa-icon>全部下载</button>
          <button id="batch-download" class="btn primary" type="button" hidden><wa-icon name="download"></wa-icon>下载所选</button>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="manager.js"></script>
</body>
</html>
